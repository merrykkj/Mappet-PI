<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MapPet | Login</title>

    <link rel="stylesheet" href="./css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat+Subrayada:wght@400;700&family=Mouse+Memoirs&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <main class="login-container">

        <section class="lado-esquerdo">

            <div class="brand">
                <span class="logo-texto">
                    MAP<span class="logo-destaque">PET</span>
                </span>

                <span class="logo-icone">
                    <i class="fa-solid fa-location-dot"></i>
                </span>
            </div>

            <div class="conteudo-esquerdo">

                <div class="texto-esquerdo">
                    <h2 class="frase-efeito">
                        CONECTANDO CORAÇÕES
                    </h2>

                    <p class="sub-frase">
                        Unindo pessoas e animais através do amor.
                    </p>
                </div>

            </div>

            <div class="decoracao decoracao-1"></div>
            <div class="decoracao decoracao-2"></div>
            <div class="decoracao decoracao-3"></div>
            <div class="decoracao decoracao-4"></div>
            <div class="decoracao decoracao-5"></div>
            <div class="decoracao decoracao-6"></div>
            <div class="decoracao decoracao-7"></div>

            <img src="assets/images/dog8.png" class="pet-dog" alt="Cachorro">

            <img src="assets/images/catndog.png" class="pet-catndog" alt="Cachorro">

        </section>


        <section class="lado-direito">

            <div class="login-content">

                <div class="header-login">

                    <div class="patinhas-decorativas">
                        <i class="fa-solid fa-paw paw-1"></i>
                        <i class="fa-solid fa-paw paw-2"></i>
                        <i class="fa-solid fa-paw paw-3"></i>
                    </div>

                    <span class="pequeno-titulo">
                        ÁREA DO USUÁRIO
                    </span>

                    <h1 class="titulo-principal">
                        BEM-VINDO
                    </h1>

                    <p class="subtitulo">
                        Faça login para continuar
                    </p>

                </div>


                <form class="form-login">

                    <div class="input-group">

                        <label for="email">
                            E-mail
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-envelope icone-input"></i>

                            <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email"
                                required>

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock icone-input"></i>

                            <input type="password" id="senha" placeholder="Digite sua senha"
                                autocomplete="current-password" required>

                            <button type="button" class="mostrar-senha" aria-label="Mostrar senha">
                                <i class="fa-regular fa-eye"></i>
                            </button>

                        </div>

                    </div>


                    <div class="opcoes-login">

                        <label class="lembrar-me">
                            <input type="checkbox">
                            <span>Lembrar de mim</span>
                        </label>

                        <a href="#">
                            Esqueci a senha
                        </a>

                    </div>


                    <button type="submit" class="btn-entrar">
                        ENTRAR
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>


                    <div class="cadastro">

                        <span>
                            Ainda não possui uma conta?
                        </span>

                        <a href="#">
                            Cadastre-se
                        </a>

                    </div>

                </form>

            </div>

        </section>

    </main>

</body>

</html>
